<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Page Image Grabber</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 760px; margin: 32px auto; padding: 0 16px; color: #222; }
  h1 { font-size: 20px; }
  button { font-size: 15px; padding: 10px 18px; border-radius: 8px; border: 0; background: #2563eb; color: #fff; cursor: pointer; }
  button:disabled { background: #999; cursor: default; }
  #status { margin: 14px 0; color: #555; }
  progress { width: 100%; height: 14px; }
  #log { font: 12px monospace; max-height: 260px; overflow: auto; background: #f4f4f5; padding: 10px; border-radius: 8px; white-space: pre-wrap; }
  @media (prefers-color-scheme: dark) { body { background: #18181b; color: #e4e4e7; } #log { background: #27272a; } #status { color: #a1a1aa; } }
</style>
</head>
<body>
  <h1>Page Image Grabber</h1>
  <p id="page"></p>
  <p id="status">Scanning page…</p>
  <button id="go" disabled>Choose folder &amp; download</button>
  <p><progress id="bar" value="0" max="1" hidden></progress></p>
  <div id="log"></div>
  <script src="app.js"></script>
</body>
</html>
